# DigitalOcean App Platform spec for server/cmd/api. Documents the
# config to enter in the App Platform console (New App > GitHub repo >
# Dockerfile) when creating the app the first time. deploy_on_push below
# means every push to main redeploys automatically after that — no
# terminal, no CLI.
#
# NEVER put the real DATABASE_URL value in this file — set it through
# the console (Settings > App-Level Environment Variables) after the app
# exists. The placeholder below is intentionally not a working value.

name: dredge4us-api
region: nyc

services:
  - name: api
    github:
      repo: jcl80/dredge4us
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: DATABASE_URL
        type: SECRET
        value: "EDIT_ME_IN_DO_CONSOLE"

workers:
  - name: poller
    github:
      repo: jcl80/dredge4us
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile.poller
    source_dir: /
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: DATABASE_URL
        type: SECRET
        value: "EDIT_ME_IN_DO_CONSOLE"
      - key: POLLER_BOARDS
        type: GENERAL
        value: "g:20s,biz:20s"
